# SonarQube Cloud / SonarQube Server analysis (see .github/workflows/sonar.yml and README).
# The key and organization are those SonarQube Cloud gives a GitHub repository it imports.
sonar.projectKey=Robak132_DOS-crafting-docs
sonar.organization=robak132
sonar.projectName=DOS crafting catalog

sonar.sources=src/main,scripts,index.html,vite.config.ts
sonar.tests=src/test
sonar.sourceEncoding=UTF-8
# Game data, generated output and extracted game files are not code.
sonar.exclusions=data/**,dist/**,assets/**,reports/**,.pak-work/**,node_modules/**
sonar.python.version=3.10
