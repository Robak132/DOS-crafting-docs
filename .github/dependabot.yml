version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      production-dependencies:
        applies-to: "version-updates"
        patterns:
          - "*"
    ignore:
      # Types follow the Node version CI runs on (26, see engines), not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "npm"
    directory: "/tools/sonar"
    schedule:
      interval: "weekly"
    groups:
      sonar-dependencies:
        applies-to: "version-updates"
        patterns:
          - "*"
    ignore:
      # The SonarJS plugin and the TypeScript parser need TypeScript 5.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      ci-dependencies:
        applies-to: "version-updates"
        patterns:
          - "*"
